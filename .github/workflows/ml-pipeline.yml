name: ML pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-test-build:
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/ids-api

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install libraries
        run: pip install -r requirements-dev.txt

      - name: Security scan of our code (bandit)
        run: bandit -r app.py schema.py train.py -ll

      - name: Check libraries for known vulnerabilities
        run: pip-audit -r requirements.txt

      - name: Get the data from S3 (dvc pull)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: dvc pull

      - name: Data tests
        run: python -m pytest tests/test_data.py

      - name: Train the model
        run: python train.py xgboost

      - name: Quality gate
        run: python -m pytest tests/test_model.py

      - name: Use the new model as the champion
        run: |
          cp model.pkl champion.pkl
          cp model.pkl.sha256 champion.pkl.sha256

      - name: API tests
        run: python -m pytest tests/test_api.py

      - name: Save the scores as a report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: metrics.json

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the image
        run: |
          docker build -t $IMAGE:build-${{ github.run_number }} .
          docker push $IMAGE:build-${{ github.run_number }}
